name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: hadolint · shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: shellcheck · shfmt
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh
          curl -sSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt -i 4 -ci -d scripts/*.sh

  test:
    name: unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is what the image ships; 20 is the oldest supported LTS. Testing
        # both stops the code drifting past the runtime it claims to support.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app

  build:
    name: image build · size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: stack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A single-stage build of the same app, purely to keep the multi-stage
      # claim in the README honest. If the gap ever disappears, this shows it.
      - name: Build a single-stage comparison
        run: |
          cat > Dockerfile.naive <<'EOF'
          FROM node:22-alpine
          WORKDIR /app
          COPY app/package.json app/package-lock.json ./
          RUN npm ci
          COPY app/ ./
          CMD ["node", "src/index.js"]
          EOF
          docker build -f Dockerfile.naive -t stack:naive .

      - name: Report image sizes
        run: |
          {
            echo "| image | size |"
            echo "|---|---|"
            echo "| multi-stage runtime | $(docker image inspect stack:ci --format '{{.Size}}' | numfmt --to=iec) |"
            echo "| single-stage        | $(docker image inspect stack:naive --format '{{.Size}}' | numfmt --to=iec) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assert the image does not run as root
        run: |
          user="$(docker image inspect stack:ci --format '{{.Config.User}}')"
          echo "configured user: ${user:-<root>}"
          test "$user" = "1000:1000"

  stack:
    name: compose stack · smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provide an environment file
        run: |
          cp .env.example .env
          # CI-only throwaway credentials; the database is never published.
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-not-a-secret/' .env

      - name: Start the stack
        run: docker compose up -d --build

      - name: Smoke tests
        run: ./scripts/smoke.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v

  scan:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for scanning
        run: docker build --target runtime -t stack:scan .

      # Fails the build on fixable HIGH/CRITICAL findings. Unfixed ones are
      # reported but do not block, since there is nothing to upgrade to.
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stack:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  docs:
    name: markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments README.md ARCHITECTURE.md LESSONS.md SECURITY.md CONTRIBUTING.md
          fail: true

      - name: Reject github.com blob URLs in image tags
        run: |
          if grep -rnE '(src="|\]\()https://github\.com/[^)"]*/blob/' \
               --include='*.md' --exclude-dir=node_modules .; then
            echo "::error::blob URLs serve text/html, not the image. Use a relative path."
            exit 1
          fi
          echo "no blob-style image URLs found"
